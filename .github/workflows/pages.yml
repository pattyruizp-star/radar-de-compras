name: Publish Radar de Compras

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble website and brand assets
        run: |
          mkdir -p public/assets
          cat site-source/site-bundle.part*.b64 | base64 --decode > /tmp/radar-site.tar.gz
          tar -xzf /tmp/radar-site.tar.gz -C public
          cat assets/logo-horizontal.part*.b64 | base64 --decode > public/assets/logo-horizontal.webp
          cat assets/banner-portada.part*.b64 | base64 --decode > public/assets/banner-portada.webp
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("public")
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              asset_prefix = "../assets/" if page.parent.name == "guias" else "assets/"
              logo_src = asset_prefix + "logo-horizontal.webp"
              pattern = re.compile(r'(<a class="brand" href="[^"]*">).*?(</a>)', re.S)
              html = pattern.sub(
                  lambda m: m.group(1) + f'<img class="brand-logo" src="{logo_src}" alt="RADAR DE COMPRAS — Descubre. Compara. Aprovecha." loading="eager">' + m.group(2),
                  html
              )
              if page.parent.name == "guias":
                  html = html.replace('<script src="script.js"></script>', '<script src="../script.js"></script>')
                  # Elegir imagen usando SOLO el título H1 de esta guía.
                  # No buscar en todo el HTML: navegación y enlaces relacionados
                  # incluyen términos de otras guías y causaban falsos emparejamientos.
                  match = re.search(r'<h1[^>]*>(.*?)</h1>', html, re.S | re.I)
                  title = re.sub(r'<[^>]+>', ' ', match.group(1) if match else '')
                  title = re.sub(r'&[^;]+;', ' ', title).lower()
                  visuales = [
                      (["bateria externa", "batería externa", "power bank"], [
                          ("https://media-www.canadiantire.ca/product/automotive/car-care-accessories/auto-electronics/0355545/bluehive-carbon-fiber-20-000-mah-power-bank-140935ff-bee3-4223-a8f4-4ee66ce7e583.png?imdensity=1&impolicy=gZoom&imwidth=640", "Batería externa conectada a un teléfono"),
                          ("https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1000&q=85", "Cargador portátil compacto"),
                      ]),
                      (["auricular", "audifono", "audífono", "headphone"], [
                          ("https://res1.x-kom.de/AllegroIMG/PRODUCENCI/CREATIVE/51EF1140AA000/creative-sluchawki-bezprzewodowe-zen-hybrid-2-lifestyle-01.jpg", "Auriculares inalámbricos en uso"),
                          ("https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=85", "Auriculares de diadema")
                      ]),
                      (["ssd", "almacenamiento externo", "disco externo"], [
                          ("https://img.evetech.co.za/repository/ProductImages/adata-se880-4tb-ssd-og-image-1200px-v1.jpeg", "Unidad SSD externa portátil"),
                          ("https://img.evetech.co.za/repository/ez/reviving-an-old-laptop-using-external-ssds-for-fas-banner.webp", "SSD externo conectado a una laptop"),
                          ("https://www.pakdukaan.pk/cdn/shop/files/Transcend-ESD265C-USB-3.2-Gen-2-Portable-External-SSD-Price-in-Pakistan-PakDukaan-1.jpg?v=1767693261", "SSD portátil conectado para transferir archivos")
                      ]),
                      (["freidora", "air fryer"], [
                          ("https://www.magnaretail.co.uk/cdn/shop/collections/Air_Fryer_Collection.jpg?v=1749716531", "Freidora de aire con cesta abierta y alimentos"),
                          ("https://catracalivre.com.br/i/q8jkVn4a0Ols9b656PvbrMSYYhxQyklRnVq6QdoFhqc/rs%3Afill%3A1200%3A630%3A1/g%3Asm/q%3A80/bG9jYWw6Ly8vMjAyNi8wNy9haXItZnJ5ZXItd2l0aC1mcmVuY2gtZnJpZXMtMS5qcGVn", "Cesta de freidora de aire con papas"),
                      ]),
                      (["licuadora", "blender"], [
                          ("https://product-hub-prd.madeiramadeira.com.br/816967722/images/145d8094-2102-4004-a85c-3449ed0b8b964eafaed9362e2b9a39e1EBS302.jpg", "Licuadora de vaso con frutas"),
                          ("https://cdn.karaca.com/rcman/cw695h695q90gm/image/000001000257873001/emsan-multiblend-smoothie-blender-grey-1000w-000001000257873001-5.jpg", "Licuadora preparando smoothies"),
                          ("https://cdn11.bigcommerce.com/s-5vfc75n1yv/images/stencil/600x600/products/8042/91756/o6fxytjrv2f55bukw4mx__76063.1769013119.jpg?c=1", "Licuadora vertiendo un batido")
                      ]),
                      (["enchufe inteligente", "smart plug", "enchufe wifi"], [
                          ("https://www.ikea.com/us/en/images/products/tretakt-plug-smart__1297331_pe935886_s5.jpg?f=xl", "Enchufe inteligente conectado en casa"),
                          ("https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=1000&q=85", "Control inteligente del hogar")
                      ]),
                      (["silla ergonomica", "silla ergonómica", "silla de oficina"], [
                          ("https://images.unsplash.com/photo-1505843490701-5be5d6b4f5a2?auto=format&fit=crop&w=1000&q=85", "Silla ergonómica de oficina"),
                          ("https://images.unsplash.com/photo-1596079890744-c1a0462d0975?auto=format&fit=crop&w=1000&q=85", "Espacio de trabajo con silla")
                      ]),
                      (["lampara", "lámpara", "iluminacion de escritorio", "iluminación de escritorio"], [
                          ("https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=85", "Lámpara de escritorio encendida"),
                          ("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=85", "Escritorio de trabajo iluminado")
                      ]),
                      (["webcam", "camara web", "cámara web"], [
                          ("https://www.segment.com.tr/images/productimages/SC_HD03_05.jpg", "Cámara web sobre monitor en videollamada"),
                          ("https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=1000&q=85", "Equipo de videollamada en escritorio")
                      ]),
                      (["mochila", "equipaje de mano", "viaje"], [
                          ("https://titantrekstore.com/cdn/shop/articles/684aa8005559d477e754ac14-1749726155464_17284d18-cd7f-46c4-ada6-a923a5148b6f.jpg?v=1750922005", "Mochila de viaje abierta y organizada"),
                          ("https://f.fcdn.app/imgs/e48439/mispetates.com/mipeuy/cac3/original/catalogo/SET.VIAJENEGRO_SC_4/1500-1500/set-de-viaje-valija-carry-on-ri-gida-mochila-expandible-sc.jpg", "Mochila y maleta de mano en aeropuerto"),
                          ("https://umnotravel.com/_next/image?q=100&url=https%3A%2F%2Fumnotravel.com%2Fapi%2Fmedia%2Ffile%2Ftravel-carry-on-packing-1200x630-1.jpg%3F2025-12-24T08%253A17%253A03.316Z&w=2048", "Equipaje organizado para un viaje")
                      ])
                  ]
                  selected = next((photos for keys, photos in visuales if any(k in title for k in keys)), None)
                  if selected:
                      # Fallback por tema para evitar huecos si un servidor externo falla.
                      fallbacks = {
                          "bateria": "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1200&q=85",
                          "auricular": "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=85",
                          "ssd": "https://images.unsplash.com/photo-1597872250969-2b5a3f5a1e7a?auto=format&fit=crop&w=1200&q=85",
                          "freidora": "https://images.unsplash.com/photo-1585515320310-259814833e62?auto=format&fit=crop&w=1200&q=85",
                          "licuadora": "https://images.unsplash.com/photo-1570222094114-d054a817e56b?auto=format&fit=crop&w=1200&q=85",
                          "enchufe": "https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=1200&q=85",
                          "silla": "https://images.unsplash.com/photo-1505843490701-5be5d6b4f5a2?auto=format&fit=crop&w=1200&q=85",
                          "lampara": "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1200&q=85",
                          "webcam": "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=1200&q=85",
                          "viaje": "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1200&q=85"
                      }
                      fallback_key = next((key for key in fallbacks if key in title or (key == "lampara" and "lámpara" in title)), "ssd")
                      fallback = fallbacks[fallback_key]
                      cards = ''.join(
                          f'<img src="{src}" data-fallback="{fallback}" onerror="this.onerror=null;this.src=this.dataset.fallback" alt="{alt}" loading="eager" width="900" height="650">'
                          for src, alt in selected
                      )
                      hero = (f'<figure class="guide-visual collage collage-{len(selected)}">{cards}'
                              f'<figcaption>Imágenes ilustrativas relacionadas con esta guía</figcaption></figure>')
                      html = re.sub(r'(</h1>)', lambda m: m.group(1) + hero, html, count=1, flags=re.I)
                  else:
                      print(f"WARNING: no se encontró imagen específica para {page.name}: {title}")
              if page.name in {"quienes-somos.html", "sobre-nosotros.html", "nosotros.html"}:
                  html = html.replace("</main>", '<div class="about-brand"><img src="assets/logo-cuadrado.svg" alt="Logo RADAR DE COMPRAS"></div></main>', 1)
              html = html.replace("</head>", '<link rel="icon" type="image/svg+xml" href="' + asset_prefix + 'logo-circular.svg"></head>', 1)
              if page.name == "index.html":
                  banner = ('<div class="brand-cover-wrap wrap"><img class="brand-cover" src="assets/banner-portada.webp" '
                            'alt="RADAR DE COMPRAS: tu guía de compras inteligentes. Descubre, compara y aprovecha." '
                            'width="640" height="320" fetchpriority="high"></div>')
                  html = html.replace('</header><main>', '</header><main>' + banner, 1)
                  html = html.replace(
                      '<meta property="og:type" content="website">',
                      '<meta property="og:type" content="website"><meta property="og:image" content="https://pattyruizp-star.github.io/radar-de-compras/assets/banner-portada.webp"><meta name="twitter:card" content="summary_large_image">',
                      1
                  )
              if page.name == "index.html":
                  # Dar una entrada visual a la categoría Tecnología / energía portátil
                  # dentro de la biblioteca editorial, sin alterar el texto ni los enlaces.
                  tech_visual = (
                      '<div class="category-visual category-tech">'
                      '<img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=1200&q=85" alt="Tecnología y dispositivos electrónicos" loading="lazy">'
                      '<img src="https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1200&q=85" alt="Energía portátil y batería externa" loading="lazy">'
                      '<img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1200&q=85" alt="Accesorios y espacio de trabajo tecnológico" loading="lazy">'
                      '</div>'
                  )
                  html, count = re.subn(
                      r'(<h[23][^>]*>[^<]*(?:Tecnología\\s*/\\s*energía portátil|Tecnologia\\s*/\\s*energia portatil)[^<]*</h[23]>)',
                      lambda m: m.group(1) + tech_visual,
                      html, count=1, flags=re.I
                  )
                  if count == 0:
                      print("INFO: no se encontró el encabezado exacto de Tecnología / energía portátil")
              if page.name == "index.html":
                  # Tarjetas editoriales: imagen real primero, contenido después.
                  visual_cards = [
                      (["bateria", "power-bank"], "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1000&q=85", "Batería externa y energía portátil"),
                      (["auricular", "audifono", "audífono"], "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=85", "Auriculares inalámbricos"),
                      (["silla-ergonomica", "silla-ergon"], "https://images.unsplash.com/photo-1505843490701-5be5d6b4f5a2?auto=format&fit=crop&w=1000&q=85", "Silla ergonómica de oficina"),
                      (["lampara", "lámpara"], "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=85", "Lámpara de escritorio"),
                      (["freidora", "air-fryer"], "https://images.unsplash.com/photo-1585515320310-259814833e62?auto=format&fit=crop&w=1000&q=85", "Freidora de aire"),
                      (["licuadora"], "https://images.unsplash.com/photo-1570222094114-d054a817e56b?auto=format&fit=crop&w=1000&q=85", "Licuadora de cocina"),
                      (["ssd", "almacenamiento"], "https://images.unsplash.com/photo-1597872250969-2b5a3f5a1e7a?auto=format&fit=crop&w=1000&q=85", "Almacenamiento externo SSD"),
                      (["mochila", "viaje"], "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1000&q=85", "Mochila y equipaje de viaje"),
                      (["webcam", "camara-web", "cámara-web"], "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=1000&q=85", "Cámara web para videollamadas")
                  ]
                  visual_script = """<script>
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('a[href*="guias/"]').forEach(function(link) {
              var href = (link.getAttribute('href') || '').toLowerCase();
              var title = (link.textContent || '').toLowerCase();
              var key = href + ' ' + title;
              var data = [
                [['bateria','power-bank'], 'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1000&q=85', 'Energía portátil'],
                [['auricular','audifono','audífono'], 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1000&q=85', 'Audio personal'],
                [['silla-ergonomica','silla-ergon'], 'https://images.unsplash.com/photo-1505843490701-5be5d6b4f5a2?auto=format&fit=crop&w=1000&q=85', 'Oficina y estudio'],
                [['lampara','lámpara'], 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=85', 'Iluminación'],
                [['freidora','air-fryer'], 'https://images.unsplash.com/photo-1585515320310-259814833e62?auto=format&fit=crop&w=1000&q=85', 'Cocina práctica'],
                [['licuadora'], 'https://images.unsplash.com/photo-1570222094114-d054a817e56b?auto=format&fit=crop&w=1000&q=85', 'Pequeños electrodomésticos'],
                [['ssd','almacenamiento'], 'https://images.unsplash.com/photo-1597872250969-2b5a3f5a1e7a?auto=format&fit=crop&w=1000&q=85', 'Almacenamiento'],
                [['mochila','viaje'], 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1000&q=85', 'Viajes'],
                [['webcam','camara-web','cámara-web'], 'https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=1000&q=85', 'Videollamadas']
              ];
              var item = data.find(function(row){ return row[0].some(function(k){return key.indexOf(k)!==-1;}); });
              if (!item) return;
              var card = link.closest('article, .guide-card, .card, li') || link.parentElement;
              if (!card || card.querySelector('.radar-card-photo')) return;
              card.classList.add('radar-image-card');
              var img = document.createElement('img');
              img.className = 'radar-card-photo';
              img.src = item[1]; img.alt = item[2]; img.loading = 'lazy';
              img.onerror = function(){ this.style.display='none'; };
              card.insertBefore(img, card.firstChild);
              card.setAttribute('data-topic', item[2]);
            });
          });
          </script>"""
                  html = html.replace("</body>", visual_script + "</body>", 1)
              page.write_text(html, encoding="utf-8")
          PY
          cat >> public/styles.css <<'CSS'
          /* Biblioteca editorial: tarjetas visuales, alegres y diferenciadas */
          .radar-image-card{overflow:hidden!important;border:1px solid #e8e1d6!important;border-radius:20px!important;background:#fffdf9!important;box-shadow:0 7px 22px rgba(28,45,73,.08)!important;transition:transform .22s ease,box-shadow .22s ease}
          .radar-image-card:hover{transform:translateY(-5px);box-shadow:0 14px 28px rgba(28,45,73,.14)!important}
          .radar-card-photo{display:block;width:100%;height:185px;object-fit:cover;background:#f0eee8}
          .radar-image-card>*:not(.radar-card-photo){position:relative}
          .radar-image-card{position:relative}
          .radar-image-card:before{content:"";position:absolute;z-index:1;top:0;left:0;width:7px;height:185px;background:linear-gradient(180deg,#f4b544,#e66d48)}
          .radar-image-card[data-topic="Audio personal"]:before{background:#e87979}
          .radar-image-card[data-topic="Oficina y estudio"]:before{background:#6eaa91}
          .radar-image-card[data-topic="Iluminación"]:before{background:#e9b94e}
          .radar-image-card[data-topic="Cocina práctica"]:before{background:#e77c50}
          .radar-image-card[data-topic="Pequeños electrodomésticos"]:before{background:#8c9fd0}
          .radar-image-card[data-topic="Almacenamiento"]:before{background:#6ba9b4}
          .radar-image-card[data-topic="Viajes"]:before{background:#d58a65}
          .radar-image-card[data-topic="Videollamadas"]:before{background:#8d9a72}
          @media(max-width:650px){.radar-card-photo{height:170px}.radar-image-card:before{height:170px}}
          .brand-logo{display:block;width:230px;height:auto;max-height:78px;object-fit:contain;flex:none}
          .guide-visual{margin:18px 0 28px;border-radius:20px;overflow:hidden;background:#eef2f7;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
          .guide-visual img{display:block;width:100%;height:245px;object-fit:cover;background:#e9edf2;min-width:0}
          .guide-visual.collage-2 img{grid-column:auto;height:300px}
          .guide-visual.collage-3 img:first-child{grid-column:1/-1;height:340px}
          .guide-visual.collage-3 img:not(:first-child){height:210px}
          .guide-visual figcaption{grid-column:1/-1;padding:9px 13px;font-size:.78rem;color:#667085;background:#f5f7fa}
          .category-visual{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin:16px 0 22px;border-radius:16px;overflow:hidden}
          .category-visual img{display:block;width:100%;height:150px;object-fit:cover;background:#eef2f7}
          .category-visual img:first-child{height:190px}
          @media(max-width:650px){.category-visual{grid-template-columns:1fr 1fr;gap:7px}.category-visual img,.category-visual img:first-child{height:125px}.category-visual img:first-child{grid-column:1/-1;height:165px}}
          .about-brand{max-width:250px;margin:28px auto;text-align:center}
          .about-brand img{display:block;width:100%;height:auto}
          @media(max-width:650px){.guide-visual{margin:14px 0 22px;border-radius:14px}.guide-visual img{height:160px}.guide-visual.collage-2 img{height:190px}.guide-visual.collage-3 img:first-child{height:220px}.guide-visual.collage-3 img:not(:first-child){height:140px}}
          .footer .brand-logo{width:260px;max-height:none}
          .footer a.brand{display:inline-flex;padding:0}
          .brand-cover-wrap{margin-top:24px;margin-bottom:0}
          .brand-cover{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;object-position:center;border-radius:22px;box-shadow:var(--shadow)}
          @media(max-width:650px){.brand-logo{width:188px;max-height:64px}.footer .brand-logo{width:240px}.brand-cover-wrap{margin-top:14px}.brand-cover{border-radius:14px}}
          CSS
          touch public/.nojekyll
          test -s public/index.html
          test -s public/assets/logo-horizontal.webp
          test -s public/assets/banner-portada.webp
          test -s public/sitemap.xml
          test -d public/guias

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

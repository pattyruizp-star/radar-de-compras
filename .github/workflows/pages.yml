name: Publish Radar de Compras

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble website and brand assets
        run: |
          mkdir -p public/assets
          cat site-source/site-bundle.part*.b64 | base64 --decode > /tmp/radar-site.tar.gz
          tar -xzf /tmp/radar-site.tar.gz -C public
          cat assets/logo-horizontal.part*.b64 | base64 --decode > public/assets/logo-horizontal.webp
          cat assets/banner-portada.part*.b64 | base64 --decode > public/assets/banner-portada.webp
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("public")
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              asset_prefix = "../assets/" if page.parent.name == "guias" else "assets/"
              logo_src = asset_prefix + "logo-horizontal.webp"
              pattern = re.compile(r'(<a class="brand" href="[^"]*">).*?(</a>)', re.S)
              html = pattern.sub(
                  lambda m: m.group(1) + f'<img class="brand-logo" src="{logo_src}" alt="RADAR DE COMPRAS — Descubre. Compara. Aprovecha." loading="eager">' + m.group(2),
                  html
              )
              if page.parent.name == "guias":
                  html = html.replace('<script src="script.js"></script>', '<script src="../script.js"></script>')
              if page.name == "index.html":
                  banner = ('<div class="brand-cover-wrap wrap"><img class="brand-cover" src="assets/banner-portada.webp" '
                            'alt="RADAR DE COMPRAS: tu guía de compras inteligentes. Descubre, compara y aprovecha." '
                            'width="640" height="320" fetchpriority="high"></div>')
                  html = html.replace('</header><main>', '</header><main>' + banner, 1)
                  html = html.replace(
                      '<meta property="og:type" content="website">',
                      '<meta property="og:type" content="website"><meta property="og:image" content="https://pattyruizp-star.github.io/radar-de-compras/assets/banner-portada.webp"><meta name="twitter:card" content="summary_large_image">',
                      1
                  )
              page.write_text(html, encoding="utf-8")
          PY
          cat >> public/styles.css <<'CSS'
          .brand-logo{display:block;width:230px;height:auto;max-height:78px;object-fit:contain;flex:none}
          .footer .brand-logo{width:260px;max-height:none}
          .footer a.brand{display:inline-flex;padding:0}
          .brand-cover-wrap{margin-top:24px;margin-bottom:0}
          .brand-cover{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;object-position:center;border-radius:22px;box-shadow:var(--shadow)}
          @media(max-width:650px){.brand-logo{width:188px;max-height:64px}.footer .brand-logo{width:240px}.brand-cover-wrap{margin-top:14px}.brand-cover{border-radius:14px}}
          CSS
          touch public/.nojekyll
          test -s public/index.html
          test -s public/assets/logo-horizontal.webp
          test -s public/assets/banner-portada.webp
          test -s public/sitemap.xml
          test -d public/guias

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

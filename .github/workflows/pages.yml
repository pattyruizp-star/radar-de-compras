name: Publish Radar de Compras

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble website and brand assets
        run: |
          mkdir -p public/assets
          cat site-source/site-bundle.part*.b64 | base64 --decode > /tmp/radar-site.tar.gz
          tar -xzf /tmp/radar-site.tar.gz -C public
          cat assets/logo-horizontal.part*.b64 | base64 --decode > public/assets/logo-horizontal.webp
          cat assets/banner-portada.part*.b64 | base64 --decode > public/assets/banner-portada.webp
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("public")
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              asset_prefix = "../assets/" if page.parent.name == "guias" else "assets/"
              logo_src = asset_prefix + "logo-horizontal.webp"
              pattern = re.compile(r'(<a class="brand" href="[^"]*">).*?(</a>)', re.S)
              html = pattern.sub(
                  lambda m: m.group(1) + f'<img class="brand-logo" src="{logo_src}" alt="RADAR DE COMPRAS — Descubre. Compara. Aprovecha." loading="eager">' + m.group(2),
                  html
              )
              if page.parent.name == "guias":
                  html = html.replace('<script src="script.js"></script>', '<script src="../script.js"></script>')
                  # Elegir imagen usando SOLO el título H1 de esta guía.
                  # No buscar en todo el HTML: navegación y enlaces relacionados
                  # incluyen términos de otras guías y causaban falsos emparejamientos.
                  match = re.search(r'<h1[^>]*>(.*?)</h1>', html, re.S | re.I)
                  title = re.sub(r'<[^>]+>', ' ', match.group(1) if match else '')
                  title = re.sub(r'&[^;]+;', ' ', title).lower()
                  visuales = [
                      (["bateria externa", "batería externa", "power bank"], "https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?auto=format&fit=crop&w=1400&q=85", "Batería externa portátil"),
                      (["auricular", "audifono", "audífono", "headphone"], "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1400&q=85", "Auriculares inalámbricos"),
                      (["ssd", "almacenamiento externo", "disco externo"], "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?auto=format&fit=crop&w=1400&q=85", "Unidad SSD externa"),
                      (["freidora", "air fryer"], "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=1400&q=85", "Freidora de aire"),
                      (["licuadora", "blender"], "https://images.unsplash.com/photo-1570222094114-d054a817e56b?auto=format&fit=crop&w=1400&q=85", "Licuadora de cocina"),
                      (["enchufe inteligente", "smart plug", "enchufe wifi"], "https://images.unsplash.com/photo-1558002038-1055907df827?auto=format&fit=crop&w=1400&q=85", "Enchufe inteligente"),
                      (["silla ergonomica", "silla ergonómica", "silla de oficina"], "https://images.unsplash.com/photo-1505843490701-5be5d6b4f5a2?auto=format&fit=crop&w=1400&q=85", "Silla ergonómica de oficina"),
                      (["lampara", "lámpara", "iluminacion de escritorio", "iluminación de escritorio"], "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1400&q=85", "Lámpara de escritorio"),
                      (["webcam", "camara web", "cámara web"], "https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=1400&q=85", "Cámara web para videollamadas"),
                      (["mochila", "equipaje de mano", "viaje"], "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=1400&q=85", "Mochila de viaje")
                  ]
                  selected = next(((src, alt) for keys, src, alt in visuales if any(k in title for k in keys)), None)
                  if selected:
                      src, alt = selected
                      hero = (f'<figure class="guide-visual"><img src="{src}" alt="{alt}" loading="eager" width="1200" height="760">'
                              f'<figcaption>{alt} · Imagen ilustrativa</figcaption></figure>')
                      html = re.sub(r'(</h1>)', lambda m: m.group(1) + hero, html, count=1, flags=re.I)
                  else:
                      print(f"WARNING: no se encontró imagen específica para {page.name}: {title}")
              if page.name in {"quienes-somos.html", "sobre-nosotros.html", "nosotros.html"}:
                  html = html.replace("</main>", '<div class="about-brand"><img src="assets/logo-cuadrado.svg" alt="Logo RADAR DE COMPRAS"></div></main>', 1)
              html = html.replace("</head>", '<link rel="icon" type="image/svg+xml" href="' + asset_prefix + 'logo-circular.svg"></head>', 1)
              if page.name == "index.html":
                  banner = ('<div class="brand-cover-wrap wrap"><img class="brand-cover" src="assets/banner-portada.webp" '
                            'alt="RADAR DE COMPRAS: tu guía de compras inteligentes. Descubre, compara y aprovecha." '
                            'width="640" height="320" fetchpriority="high"></div>')
                  html = html.replace('</header><main>', '</header><main>' + banner, 1)
                  html = html.replace(
                      '<meta property="og:type" content="website">',
                      '<meta property="og:type" content="website"><meta property="og:image" content="https://pattyruizp-star.github.io/radar-de-compras/assets/banner-portada.webp"><meta name="twitter:card" content="summary_large_image">',
                      1
                  )
              page.write_text(html, encoding="utf-8")
          PY
          cat >> public/styles.css <<'CSS'
          .brand-logo{display:block;width:230px;height:auto;max-height:78px;object-fit:contain;flex:none}
          .guide-visual{margin:18px 0 28px;border-radius:20px;overflow:hidden;background:#eef2f7}
          .guide-visual img{display:block;width:100%;max-height:460px;object-fit:cover;aspect-ratio:16/9}
          .guide-visual figcaption{padding:8px 13px;font-size:.78rem;color:#667085;background:#f5f7fa}
          .about-brand{max-width:250px;margin:28px auto;text-align:center}
          .about-brand img{display:block;width:100%;height:auto}
          @media(max-width:650px){.guide-visual{margin:14px 0 22px;border-radius:14px}.guide-visual img{aspect-ratio:4/3}}
          .footer .brand-logo{width:260px;max-height:none}
          .footer a.brand{display:inline-flex;padding:0}
          .brand-cover-wrap{margin-top:24px;margin-bottom:0}
          .brand-cover{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;object-position:center;border-radius:22px;box-shadow:var(--shadow)}
          @media(max-width:650px){.brand-logo{width:188px;max-height:64px}.footer .brand-logo{width:240px}.brand-cover-wrap{margin-top:14px}.brand-cover{border-radius:14px}}
          CSS
          touch public/.nojekyll
          test -s public/index.html
          test -s public/assets/logo-horizontal.webp
          test -s public/assets/banner-portada.webp
          test -s public/sitemap.xml
          test -d public/guias

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
